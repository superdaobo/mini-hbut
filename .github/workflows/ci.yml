name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "website/**"
      - "soft-copyright/**"
      - ".github/workflows/dev-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/sync-website.yml"
      - ".github/workflows/website-modules.yml"
      - ".github/workflows/sync-main-to-dev.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # PR 变更范围检测：仅 pull_request 事件运行，输出 frontend / rust 两个范围
  # push 到 main/dev 时不做裁剪（全量验证），由下游 job 的 if 条件兜底
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
            rust:
              - 'src-tauri/**'

  test-frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Pillow for icon regeneration
        run: python -m pip install Pillow

      - name: Regenerate and verify official icons
        run: |
          python scripts/regenerate_official_icons.py
          npx vitest run src/utils/windows_taskbar_icon_contract.spec.ts src/utils/ios_launcher_icon_contract.spec.ts src/utils/android_launcher_icon_contract.spec.ts

      - name: Production build smoke
        run: |
          npm run build
          node scripts/check_strict_csp_bundle.mjs
          node scripts/test_strict_csp_bundle.mjs

      - name: Website module build smoke
        env:
          MODULE_OUTPUT_ROOT: ${{ runner.temp }}/mini-hbut-module-smoke
        run: node scripts/build_website_modules.mjs --modules clumsy_bird_hbut

      - name: Capacitor sync smoke
        run: npx cap sync

      - name: Run Vitest
        run: npm run test:ci

      - name: Frontend safety and architecture guards
        run: |
          node scripts/check-frontend-safety.mjs
          node scripts/check-design-tokens.mjs
          node scripts/check_arch_guards.mjs
          node scripts/test_npm_cli_path.mjs
          node scripts/test_capacitor_tar_compat.mjs
          node scripts/test_post_merge_workflow_contract.mjs

      - name: Sensitive upload guard (tracked files)
        run: node scripts/guard_sensitive_uploads.mjs pre-commit

      - name: Check dist boundary script
        run: node scripts/check_dist_boundary.mjs

      - name: Vue typecheck (full tsconfig)
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Tauri npm/rust version alignment
        run: npm exec -- tauri info

  test-rust:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend deps and build dist
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib

  # Windows-only 编译保护：只做 cargo check，不构建 NSIS、不启动 EXE、不上传产物
  # 替代旧的 Windows Release Dry Run 对普通源码 PR 的全量打包（#598 Layer 4）
  test-rust-windows:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend dist (tauri build.rs prerequisite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: mini-hbut-pr-rust-check-windows

      - name: Cargo check (Windows-only compile protection)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

  # 稳定名称的 PR Gate：#598 要求 required check 名称稳定，不出现永久 Pending
  # 只接受 success / skipped，任何 failure / cancelled / timed_out 都阻断合并
  pr-gate:
    needs: [changes, test-frontend, test-rust, test-rust-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.test-frontend.result }}
          RUST: ${{ needs.test-rust.result }}
          RUST_WINDOWS: ${{ needs.test-rust-windows.result }}
        run: |
          for gate in "$CHANGES" "$FRONTEND" "$RUST" "$RUST_WINDOWS"; do
            case "$gate" in
              success|skipped) ;;
              *)
                echo "PR Gate blocked: required check ended with '$gate'"
                exit 1
                ;;
            esac
          done
          echo "PR Gate: all required checks passed (success or skipped)"
