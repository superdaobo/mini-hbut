name: Release Readiness

on:
  # #598：完整 Release Readiness 后置到 main 合并后，普通 PR 不再重复执行 check:all
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/client/package-lock.json
            website/package-lock.json
      - name: Install client dependencies
        working-directory: apps/client
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install website dependencies
        run: npm ci --prefix website --prefer-offline --no-audit --no-fund
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./apps/client/src-tauri -> target
      - name: Unified release readiness gate
        working-directory: apps/client
        run: npm run check:release
