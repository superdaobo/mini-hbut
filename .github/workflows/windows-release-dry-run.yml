name: Windows Release Dry Run

on:
  # #598：普通源码 PR 不再触发完整 NSIS Release build + smoke
  # 仅 packaging / release 配置相关变更才在 PR 与 main 上运行
  # #797：NSIS/WiX 模板与安装器回归脚本变更也纳入触发范围
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-release-dry-run.yml"
      - "apps/client/package.json"
      - "apps/client/package-lock.json"
      - "apps/client/vite.config.*"
      - "apps/client/src-tauri/Cargo.toml"
      - "apps/client/src-tauri/Cargo.lock"
      - "apps/client/src-tauri/tauri.conf.json"
      - "apps/client/src-tauri/build.rs"
      - "apps/client/src-tauri/icons/**"
      - "apps/client/src-tauri/nsis/**"
      - "apps/client/src-tauri/wix/**"
      - "apps/client/scripts/ci/windows_release_smoke.ps1"
      - "apps/client/scripts/ci/windows_installer_regression.ps1"
      - "apps/client/scripts/ci/build_msi_uninstall_launcher.ps1"
      - "apps/client/src/utils/nsis_installer_contract.spec.ts"
      - "apps/client/src/utils/msi_installer_contract.spec.ts"
      - "scripts/verify_release_config.mjs"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-release-dry-run.yml"
      - "apps/client/package.json"
      - "apps/client/package-lock.json"
      - "apps/client/vite.config.*"
      - "apps/client/src-tauri/Cargo.toml"
      - "apps/client/src-tauri/Cargo.lock"
      - "apps/client/src-tauri/tauri.conf.json"
      - "apps/client/src-tauri/build.rs"
      - "apps/client/src-tauri/icons/**"
      - "apps/client/src-tauri/nsis/**"
      - "apps/client/src-tauri/wix/**"
      - "apps/client/scripts/ci/windows_release_smoke.ps1"
      - "apps/client/scripts/ci/windows_installer_regression.ps1"
      - "apps/client/scripts/ci/build_msi_uninstall_launcher.ps1"
      - "apps/client/src/utils/nsis_installer_contract.spec.ts"
      - "apps/client/src/utils/msi_installer_contract.spec.ts"
      - "scripts/verify_release_config.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: windows-release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MINI_HBUT_BUILD_PROFILE: release
  CARGO_INCREMENTAL: "0"

jobs:
  build-and-smoke:
    runs-on: windows-latest
    # #797：加入 MSI 构建 + 安装器回归（升级链/卸载/中文化），70min 不够用
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prune non-runtime files
        shell: pwsh
        run: |
          if (Test-Path "apps/client/src-tauri/exports") { Remove-Item "apps/client/src-tauri/exports" -Recurse -Force }
          if (Test-Path "apps/client/.tauri-tmp") { Remove-Item "apps/client/.tauri-tmp" -Recurse -Force }
          if (Test-Path "dist-dry-run") { Remove-Item "dist-dry-run" -Recurse -Force }
          if (Test-Path "captures") { Remove-Item "captures" -Recurse -Force }
          if (Test-Path "tools/.session_cookies.json") { Remove-Item "tools/.session_cookies.json" -Force }
          Get-ChildItem "apps/client/src-tauri" -Recurse -File -Include *.ics,*.bak,*.tmp | Remove-Item -Force
          Get-ChildItem "." -Recurse -File -Include *.log,*.cache | Remove-Item -Force

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./apps/client/src-tauri -> target
          shared-key: mini-hbut-release-dry-run-windows

      - name: Install dependencies
        working-directory: apps/client
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify frozen release configuration
        working-directory: apps/client
        run: npm run check:release-config

      - name: Regenerate and verify official icons
        shell: pwsh
        working-directory: apps/client
        run: |
          python -m pip install Pillow
          python scripts/regenerate_official_icons.py
          npx vitest run src/utils/windows_taskbar_icon_contract.spec.ts src/utils/ios_launcher_icon_contract.spec.ts src/utils/android_launcher_icon_contract.spec.ts src/utils/windows_release_dry_run_contract.spec.ts

      - name: Prepare MSI uninstall launcher (#798)
        shell: pwsh
        working-directory: apps/client
        # 兄弟脚本负责 cargo build 启动器并放到 target/release/ 根目录；
        # bundler 会在 MSI 打包开始时清空 wix/x64 工作目录，所以 uninstall.exe
        # 必须放在不被清理的位置，由 main.wxs 以 ..\..\uninstall.exe 相对引用
        run: ./scripts/ci/build_msi_uninstall_launcher.ps1

      - name: Build release-profile NSIS and MSI installers
        working-directory: apps/client
        # #797：dry-run 同时构建 NSIS 与 MSI（smoke 仍只测 NSIS，MSI 由回归脚本覆盖）
        run: npm run tauri build -- --bundles nsis,msi

      - name: Launch release executable and capture smoke evidence
        shell: pwsh
        working-directory: apps/client
        run: ./scripts/ci/windows_release_smoke.ps1

      - name: Run installer regression suite (#797)
        shell: pwsh
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          # 注意：$args 是 PowerShell 自动变量，内联脚本里给它赋值会被引擎重置，
          # 导致 splatting 变成空参数（CI 实证：-NsisInstaller/-MsiInstaller 丢失）。
          # 必须使用自定义变量名 + 显式 splatting。
          $regArgs = @()
          if ($nsis) { $regArgs += @('-NsisInstaller', $nsis.FullName) }
          if ($msi) { $regArgs += @('-MsiInstaller', $msi.FullName) }
          ./scripts/ci/windows_installer_regression.ps1 @regArgs

      - name: Report packaged size
        shell: pwsh
        working-directory: apps/client
        run: |
          $env:BUNDLE_ROOT = "dist-dry-run"
          node scripts/report_bundle_sizes.mjs

      - name: List dry-run evidence files
        shell: pwsh
        working-directory: apps/client
        run: |
          Get-ChildItem dist-dry-run -File | ForEach-Object { Write-Host "evidence: $($_.Name) ($($_.Length) bytes)" }

      - name: Verify version sources were not mutated
        shell: pwsh
        run: git diff --exit-code -- apps/client/package.json apps/client/package-lock.json apps/client/src-tauri/Cargo.toml apps/client/src-tauri/Cargo.lock apps/client/src-tauri/tauri.conf.json

      - name: Upload dry-run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-dry-run-${{ github.run_id }}
          path: apps/client/dist-dry-run/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
