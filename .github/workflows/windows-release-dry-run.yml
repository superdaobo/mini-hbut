name: Windows Release Dry Run

on:
  # #598：普通源码 PR 不再触发完整 NSIS Release build + smoke
  # 仅 packaging / release 配置相关变更才在 PR 与 main 上运行
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-release-dry-run.yml"
      - "apps/client/package.json"
      - "apps/client/package-lock.json"
      - "apps/client/vite.config.*"
      - "apps/client/src-tauri/Cargo.toml"
      - "apps/client/src-tauri/Cargo.lock"
      - "apps/client/src-tauri/tauri.conf.json"
      - "apps/client/src-tauri/build.rs"
      - "apps/client/src-tauri/icons/**"
      - "apps/client/scripts/ci/windows_release_smoke.ps1"
      - "scripts/verify_release_config.mjs"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-release-dry-run.yml"
      - "apps/client/package.json"
      - "apps/client/package-lock.json"
      - "apps/client/vite.config.*"
      - "apps/client/src-tauri/Cargo.toml"
      - "apps/client/src-tauri/Cargo.lock"
      - "apps/client/src-tauri/tauri.conf.json"
      - "apps/client/src-tauri/build.rs"
      - "apps/client/src-tauri/icons/**"
      - "apps/client/scripts/ci/windows_release_smoke.ps1"
      - "scripts/verify_release_config.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: windows-release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MINI_HBUT_BUILD_PROFILE: release
  CARGO_INCREMENTAL: "0"

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prune non-runtime files
        shell: pwsh
        run: |
          if (Test-Path "apps/client/src-tauri/exports") { Remove-Item "apps/client/src-tauri/exports" -Recurse -Force }
          if (Test-Path "apps/client/.tauri-tmp") { Remove-Item "apps/client/.tauri-tmp" -Recurse -Force }
          if (Test-Path "dist-dry-run") { Remove-Item "dist-dry-run" -Recurse -Force }
          if (Test-Path "captures") { Remove-Item "captures" -Recurse -Force }
          if (Test-Path "tools/.session_cookies.json") { Remove-Item "tools/.session_cookies.json" -Force }
          Get-ChildItem "apps/client/src-tauri" -Recurse -File -Include *.ics,*.bak,*.tmp | Remove-Item -Force
          Get-ChildItem "." -Recurse -File -Include *.log,*.cache | Remove-Item -Force

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./apps/client/src-tauri -> target
          shared-key: mini-hbut-release-dry-run-windows

      - name: Install dependencies
        working-directory: apps/client
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify frozen release configuration
        working-directory: apps/client
        run: npm run check:release-config

      - name: Regenerate and verify official icons
        shell: pwsh
        working-directory: apps/client
        run: |
          python -m pip install Pillow
          python scripts/regenerate_official_icons.py
          npx vitest run src/utils/windows_taskbar_icon_contract.spec.ts src/utils/ios_launcher_icon_contract.spec.ts src/utils/android_launcher_icon_contract.spec.ts src/utils/windows_release_dry_run_contract.spec.ts

      - name: Build release-profile NSIS installer
        working-directory: apps/client
        run: npm run tauri build -- --bundles nsis

      - name: Launch release executable and capture smoke evidence
        shell: pwsh
        working-directory: apps/client
        run: ./scripts/ci/windows_release_smoke.ps1

      - name: Report packaged size
        shell: pwsh
        working-directory: apps/client
        run: |
          $env:BUNDLE_ROOT = "dist-dry-run"
          node scripts/report_bundle_sizes.mjs

      - name: Verify version sources were not mutated
        shell: pwsh
        run: git diff --exit-code -- apps/client/package.json apps/client/package-lock.json apps/client/src-tauri/Cargo.toml apps/client/src-tauri/Cargo.lock apps/client/src-tauri/tauri.conf.json

      - name: Upload dry-run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-dry-run-${{ github.run_id }}
          path: apps/client/dist-dry-run/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
