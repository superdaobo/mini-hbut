# One-time delivery helper for issue #1089.
# Only the push that introduces this workflow on main can trigger it.
# Remove this file through a separate PR after verifying the TestFlight run.
name: Dispatch TestFlight for #1089 (one shot)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-testflight-1089.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'superdaobo/mini-hbut'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger the existing TestFlight workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run ios-testflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field whats_new='首页新增绿点通知中心和全屏公告详情，背景虚化、远程公告去重及缓存修复。'
          echo 'Dispatched ios-testflight.yml on main.'
