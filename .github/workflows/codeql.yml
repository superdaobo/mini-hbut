name: CodeQL

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "website/**"
      - "soft-copyright/**"
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # #598 分层：PR 只保留 javascript-typescript 快速安全反馈（非 required）
  # push main / schedule / workflow_dispatch 运行完整 3 语言。
  # 注意：job 级 if 不能引用 matrix 上下文（会在 workflow 解析阶段报错），
  # 因此将原矩阵拆为三个命名 job，display name 保持不变（required check 名）。
  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: javascript-typescript

      - name: Install frontend dependencies (apps/client)
        working-directory: apps/client
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend dist (apps/client)
        working-directory: apps/client
        run: npm run build

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:javascript-typescript"

  analyze-rust:
    name: Analyze (rust)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (Rust autobuild prerequisite)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Build frontend dist (Rust autobuild prerequisite)
        working-directory: apps/client
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - name: Install Linux dependencies (Rust autobuild prerequisite)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            build-essential

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: rust

      # 根目录已无 Cargo.toml：CodeQL autobuild 无法在根发现构建系统，
      # 改为显式构建 apps/client/src-tauri（init 注入的 CODEQL_* 环境变量会捕获构建追踪）。
      - name: Build Rust project (apps/client)
        run: cargo build --manifest-path apps/client/src-tauri/Cargo.toml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:rust"

  analyze-actions:
    name: Analyze (actions)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:actions"
