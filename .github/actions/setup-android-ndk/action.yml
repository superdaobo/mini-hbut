name: Setup Android NDK
description: Install pinned Android NDK and export environment variables
runs:
  using: composite
  steps:
    - name: Setup Android NDK
      shell: bash
      # 脚本已随客户端迁至 apps/client/scripts/ci/；脚本内部只用 $ANDROID_SDK_ROOT，与 cwd 无关
      run: bash apps/client/scripts/ci/setup_android_ndk.sh
