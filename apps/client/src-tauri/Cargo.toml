[package]
name = "hbut-helper"
version = "1.4.8"
edition = "2021"
description = "湖北工业大学教务助手 - Tauri 桌面应用"
authors = ["HBUT Helper Team"]
license = "GPL-3.0-or-later"

# Release 编译优化 - 以最小体积为优先
[profile.release]
opt-level = "z"      # 极致体积优化
lto = "fat"          # 更激进的跨 crate 优化
codegen-units = 1    # 单单元，换取更小产物
panic = "abort"      # 移除 panic 展开代码
strip = "symbols"    # 去除符号表
debug = 0            # 不保留调试信息
incremental = false  # release 不使用增量编译

# Android 专用优化
[profile.release.package."*"]
opt-level = "z"

[lib]
name = "hbut_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable"] }
tauri-plugin-fs = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-keep-screen-on = "0.1.4"
tauri-plugin-window-state = "2.4"
# #621：统一 minihbut:// 深链入口（desktop + mobile 共用 source 配置；Windows/Linux 生产注册由安装器完成）。
tauri-plugin-deep-link = "2"
# 自研移动后台插件骨架（#611）：Android WorkManager / iOS BGTask 统一原生承载层。
tauri-plugin-hbut-background = { path = "plugins/tauri-plugin-hbut-background" }
serde = { version = "1.0", features = ["derive"] }
# #671 线上可观测性：接入 tauri-plugin-log 提供 stdout + 日志目录双目标文件日志（release 版 stderr 被 windows_subsystem 丢弃）。
tauri-plugin-log = "2"
log = "0.4"
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "fs", "net", "sync", "time"] }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
futures = "0.3"
async-stream = "0.3"
scraper = "0.20"
regex = "1.10"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
aes = "0.8"
cbc = "0.1"
rand = "0.8"
thiserror = "1.0"
rusqlite = { version = "0.38.0", features = ["bundled", "backup"] }
chrono = { version = "0.4.43", features = ["serde"] }
html-escape = "0.2"
urlencoding = "2.1"
md5 = "0.7"
qrcode = { version = "0.14", optional = true }
jsonwebtoken = { version = "10.3", optional = true }
sha2 = "0.10"
sha1 = "0.10"
zip = "2.2"
png = "0.17"
rqrr = "0.10.1"
image = "0.25"
dashmap = "6"
url = "2"
# keyring 基础行不带任何平台 feature：保证无原生后端的平台（如 Android）也能编译通过；
# 各平台真正的持久化后端在下方 [target.*] 段按 target 启用
# （#669：keyring v3 缺平台 feature 时会静默回退「零持久化」mock 存储，写入假成功）。
keyring = "3"
smcrypto = "0.3.1"
# #622：设备 Ed25519 密钥与 approve 签名（V1 固定 Ed25519；私钥只进 OS keyring，fail closed）。
ed25519-dalek = { version = "2", features = ["zeroize"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
notify-rust = "4.18"
xcap = "0.7"
# #621：Single Instance + deep-link feature：Windows/Linux 第二实例启动时把深链转发给已运行实例。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
# #669：必须显式启用 windows-native（Credential Manager），否则 keyring v3 静默回退零持久化 mock 存储。
keyring = { version = "3", features = ["windows-native"] }

# #669：Apple 平台启用系统 Keychain 原生后端（macOS Keychain / iOS Keychain）。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# #669：Linux 使用 Secret Service D-Bus 后端（GNOME Keyring/KWallet）；
# 不用 linux-native：keyutils 会话密钥环重启即失效，不满足持久化要求。
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# 默认仅核心集：custom-protocol。本地/桌面构建经 tauri.conf.json build.features 追加 mobile-full+bridge；
# 移动端发布构建用 --config 覆盖（Android=mobile-slim，iOS=mobile-slim+bridge），实现 #594/#595 的能力裁剪。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
testing = []
# 完整版业务能力：Yuketang 刷课/自动化、QR 登录与 online-learning 同步（#594）。不启用则这些能力与其独占依赖从构建退出。
mobile-full = ["dep:tokio-tungstenite", "dep:qrcode"]
# 本地 HTTP Bridge（#593/#594）：Android 移动端发布不启用整组退出；iOS 发布显式启用保留。
bridge = ["dep:axum", "dep:tower-http", "dep:jsonwebtoken"]
# 移动端发布构建精简集：Android=i mobile-slim；iOS=mobile-slim,bridge。追加语义（tauri CLI 只能追加 features）。
mobile-slim = []

[dev-dependencies]
proptest = "1"
proptest-derive = "0.5"
wiremock = "0.6"
tempfile = "3"
# 测试专用：qr_decode.rs 的 #[cfg(test)] 单测用 qrcode 生成 QR 图（签到解码本身用 rqrr）。
# 不进入发布依赖图（[dependencies] 中 qrcode 仍为 optional，仅 mobile-full 启用）。
qrcode = "0.14"

# 自研插件 workspace（#611：tauri-plugin-hbut-background 移动后台插件骨架）。
# 后续自研插件统一追加到 members；release profile 与 lint 配置随 workspace 根生效。
[workspace]
members = ["plugins/tauri-plugin-hbut-background"]
resolver = "2"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
