<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <title>HBUT 成绩查询</title>
  <!-- 图标字体已改为本地 npm 包，由 main.ts 延迟加载，无 CDN 依赖 -->
  <style>
    @layer reset, legacy, tailwind;

    @layer reset {
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: text;
        user-select: text;
      }
    }

    html,
    body,
    #app {
      height: 100%;
      font-family: var(--ui-font-family);
      touch-action: manipulation;
      overscroll-behavior: none;
      /* 全局隐藏滚动条 */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #app::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    /* 禁止双击缩放 */
    html {
      touch-action: manipulation;
    }

    /* 暗色模式下确保整个视口背景为深色 */
    html.dark,
    html.dark body,
    html.dark #app {
      background-color: #0f172a !important;
      background: #0f172a !important;
    }

    /* ══════════════════════════════════════
       原生 HTML Splash（Vue 挂载前显示）
       ══════════════════════════════════════ */
    .native-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .native-splash-bg {
      position: absolute;
      inset: 0;
    }
    .native-splash-bg-image {
      position: absolute;
      inset: 0;
      background:
        url('/splash/cas_bg.webp') center/cover no-repeat,
        linear-gradient(145deg, #0f172a 0%, #0f4c81 42%, #1d4ed8 100%);
      animation: _nsBgKen 20s ease-in-out infinite alternate;
    }
    .native-splash-bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.25) 0%, transparent 70%),
        radial-gradient(ellipse at 80% 100%, rgba(34,211,238,0.15) 0%, transparent 60%),
        linear-gradient(180deg, rgba(15,23,42,0.15) 0%, rgba(15,23,42,0.35) 100%);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .native-splash-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .native-splash-particles span {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      left: calc(5% * var(--i));
      top: calc(100% + 10px);
      animation: _nsParticleRise calc(4s + var(--i) * 0.3s) calc(var(--i) * 0.15s) ease-in infinite;
      opacity: 0;
    }
    .native-splash-particles span:nth-child(odd) {
      width: 3px; height: 3px;
      background: rgba(99,102,241,0.6);
    }
    .native-splash-particles span:nth-child(3n) {
      width: 5px; height: 5px;
      background: rgba(34,211,238,0.5);
    }
    .native-splash-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      width: 100%;
      max-width: 420px;
      animation: _nsFadeSlideIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .native-splash-logo-ring {
      position: relative;
      width: 88px; height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .native-splash-logo-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        rgba(99,102,241,0.8),
        rgba(168,85,247,0.6),
        rgba(34,211,238,0.8),
        rgba(99,102,241,0.8));
      animation: _nsRingSpin 3s linear infinite;
      filter: blur(1px);
    }
    .native-splash-logo-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 30px rgba(99,102,241,0.3), 0 0 60px rgba(99,102,241,0.15);
    }
    .native-splash-logo-ring img {
      position: relative;
      z-index: 1;
      width: 56px; height: 56px;
      object-fit: contain;
      animation: _nsLogoPulse 2s ease-in-out infinite;
    }
    .native-splash-title {
      font-size: 28px;
      font-weight: 700;
      color: white;
      letter-spacing: 2px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 40px rgba(99,102,241,0.4);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .native-splash-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 4px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .native-splash-building {
      width: min(280px, 70vw);
      max-height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(99,102,241,0.3)) brightness(1.05);
      animation: _nsBuildingFloat 4s ease-in-out infinite;
      opacity: 0;
      animation-delay: 0.4s;
      animation-fill-mode: backwards;
    }
    .native-splash-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      animation: _nsFadeSlideIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.7s both;
    }
    .native-splash-spinner {
      position: relative;
      width: 48px; height: 48px;
    }
    .native-splash-spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: rgba(255,255,255,0.9);
      animation: _nsSpinnerSpin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
    }
    .native-splash-spinner-ring:nth-child(2) {
      inset: 5px;
      border-top-color: rgba(99,102,241,0.8);
      animation-duration: 1.6s;
      animation-direction: reverse;
    }
    .native-splash-spinner-ring:nth-child(3) {
      inset: 10px;
      border-top-color: rgba(34,211,238,0.7);
      animation-duration: 2s;
    }
    .native-splash-spinner-dot {
      position: absolute;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 10px rgba(255,255,255,0.6);
      animation: _nsDotPulse 1.2s ease-in-out infinite;
    }
    .native-splash-text {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-width: 180px;
      text-align: center;
    }

    @keyframes _nsBgKen {
      0%   { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    @keyframes _nsRingSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes _nsLogoPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    @keyframes _nsBuildingFloat {
      0%   { opacity: 1; transform: translateY(0); }
      50%  { opacity: 1; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes _nsSpinnerSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes _nsDotPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50%      { opacity: 1;   transform: scale(1.2); }
    }
    @keyframes _nsParticleRise {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      10%  { opacity: 0.8; transform: translateY(-20px) scale(1); }
      90%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(calc(-100vh - 20px)) scale(0.5); }
    }
    @keyframes _nsFadeSlideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-height: 580px) {
      .native-splash-building-wrap { display: none; }
      .native-splash-content { gap: 16px; }
      .native-splash-logo-ring { width: 72px; height: 72px; }
      .native-splash-logo-ring img { width: 44px; height: 44px; }
      .native-splash-title { font-size: 24px; }
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 原生 HTML Splash：仅 Vue 挂载前占位；必须有纯 JS 超时，否则模块加载卡住会永远停在这里 -->
    <div class="native-splash" id="native-splash">
      <div class="native-splash-bg">
        <div class="native-splash-bg-image"></div>
        <div class="native-splash-bg-overlay"></div>
        <div class="native-splash-particles">
          <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
          <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
          <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
          <span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
          <span style="--i:13"></span><span style="--i:14"></span><span style="--i:15"></span>
          <span style="--i:16"></span><span style="--i:17"></span><span style="--i:18"></span>
          <span style="--i:19"></span><span style="--i:20"></span>
        </div>
      </div>
      <div class="native-splash-content">
        <div class="native-splash-logo-ring">
          <img src="/splash/app_icon.png" alt="Mini-HBUT" />
        </div>
        <h1 class="native-splash-title">Mini-HBUT</h1>
        <p class="native-splash-subtitle">湖北工业大学智慧校园助手</p>
        <div class="native-splash-building-wrap">
          <img src="/splash/cas_building.png" alt="" class="native-splash-building" />
        </div>
        <div class="native-splash-loader">
          <div class="native-splash-spinner">
            <div class="native-splash-spinner-ring"></div>
            <div class="native-splash-spinner-ring"></div>
            <div class="native-splash-spinner-ring"></div>
            <div class="native-splash-spinner-dot"></div>
          </div>
          <p class="native-splash-text" id="native-splash-text">正在启动…</p>
          <p class="native-splash-text" style="font-size:12px;opacity:0.7;margin-top:4px">点击可跳过</p>
        </div>
      </div>
    </div>
  </div>
  <!--
    启动诊断（#991 / #992）：本段必须在任何模块脚本之前执行，否则启动页阶段的证据会丢失
    （initDebugLogger 之后 console 才被 patch，且它只驻留内存、崩溃即丢）。

    采集内容全部为「时间戳 / 事件名 / 阶段耗时 / 失败资源 URL（去 query）」，
    不含任何凭据或用户内容；容量有界，只保留最近两次启动。
    消费方：src/utils/boot_diagnostics.ts（回放 + 报告格式化）。
  -->
  <script>
    (function () {
      var STORAGE_KEY = 'hbu_boot_diag_v1'
      var MAX_ENTRIES = 240
      var MAX_STALLS = 8
      // 主线程心跳间隔与「冻结」判定阈值：正常定时器抖动远小于 700ms
      var HEARTBEAT_MS = 250
      var STALL_THRESHOLD_MS = 700
      var FLUSH_INTERVAL_MS = 2000

      var hasPerf = typeof performance !== 'undefined' && typeof performance.now === 'function'
      var nowFn = hasPerf ? function () { return performance.now() } : function () { return Date.now() }
      var startPerf = nowFn()
      var rel = function (t) { return Math.round(t - startPerf) }

      function sanitizeText(input, max) {
        var text
        try {
          if (typeof input === 'string') text = input
          else if (input === null || input === undefined) text = String(input)
          else text = JSON.stringify(input)
        } catch (e) {
          text = String(input)
        }
        text = String(text == null ? '' : text)
        text = text.replace(
          /((?:access|refresh|id)?[_-]?token|cookie|authorization|password|passwd|secret|session[_-]?id)\s*[=:]\s*[^\s;&"',}]+/gi,
          '$1=[已脱敏]'
        )
        var limit = max || 240
        return text.length > limit ? text.slice(0, limit) + '…' : text
      }

      // 只保留 origin + pathname，丢掉 query / hash，避免令牌随 URL 落盘
      function sanitizeUrl(raw) {
        var text = String(raw == null ? '' : raw).trim()
        if (!text) return ''
        try {
          var url = new URL(text, location.href)
          // 非特殊 scheme（tauri:// 等）下 origin 是字面量 "null"，必须回退到 protocol + host
          var origin = url.origin && url.origin !== 'null' ? url.origin : url.protocol + '//' + url.host
          return origin + url.pathname
        } catch (e) {
          return text.split('?')[0].split('#')[0]
        }
      }

      // ── 读取上一次启动（可能是一次未走完的崩溃） ──
      var previous = null
      var restarts = 0
      try {
        var raw = localStorage.getItem(STORAGE_KEY)
        if (raw) {
          var parsed = JSON.parse(raw)
          if (parsed && parsed.current) previous = parsed.current
          if (parsed && typeof parsed.restarts === 'number') restarts = parsed.restarts
        }
      } catch (e) { /* 存储不可用时仍继续，只是没有跨启动证据 */ }
      restarts += 1

      var state = {
        v: 1,
        bootId: 'boot-' + Date.now() + '-' + Math.random().toString(16).slice(2, 8),
        startedAtWall: Date.now(),
        entries: [],
        stalls: [],
        finished: false,
        meta: {
          user_agent: sanitizeText(typeof navigator !== 'undefined' ? navigator.userAgent : ''),
          visibility: typeof document !== 'undefined' ? document.visibilityState : '',
          screen: typeof screen !== 'undefined' && screen.width ? screen.width + 'x' + screen.height : '',
          dpr: (typeof window !== 'undefined' && window.devicePixelRatio) || 1,
          hardware_concurrency: (typeof navigator !== 'undefined' && navigator.hardwareConcurrency) || 0,
          device_memory_gb: (typeof navigator !== 'undefined' && navigator.deviceMemory) || 0,
          restart_index: restarts
        }
      }

      function push(name, detail, force) {
        if (state.entries.length >= MAX_ENTRIES) {
          if (!force) return
          state.entries.pop()
        }
        state.entries.push({ t: rel(nowFn()), name: name, detail: detail || undefined })
      }

      var flushTimer = null
      function sampleMemory() {
        try {
          var m = performance.memory
          if (m && m.usedJSHeapSize) {
            state.meta.js_heap_used_mb = Math.round(m.usedJSHeapSize / 1048576)
            state.meta.js_heap_limit_mb = Math.round(m.jsHeapSizeLimit / 1048576)
          }
        } catch (e) { /* ignore */ }
      }

      function flush() {
        try {
          sampleMemory()
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            current: state,
            previous: previous || undefined,
            restarts: restarts
          }))
        } catch (e) { /* 配额/隐私模式失败不影响启动 */ }
      }

      function scheduleFlush() {
        if (flushTimer) return
        flushTimer = setTimeout(function () { flushTimer = null; flush() }, 800)
      }

      function markFinished(name) {
        state.finished = true
        state.finishedAt = rel(nowFn())
        push(name, { finished_at: state.finishedAt }, true)
        // 启动已完成：停掉心跳，避免应用整个生命周期都每 250ms 唤醒一次
        stopHeartbeat()
        flush()
      }

      window.__hbuBootDiag = {
        push: function (name, detail) { push(name, detail); scheduleFlush() },
        flush: flush,
        markFinished: markFinished,
        snapshot: function () { return state }
      }
      window.__HBU_BOOT_DIAG__ = state

      if (previous && previous.finished === false) {
        push('previous-boot-incomplete', {
          boot_id: previous.bootId,
          entries: (previous.entries || []).length,
          stalls: (previous.stalls || []).length
        }, true)
      }

      push('inline-script', { ready_state: document.readyState })

      // ── 主线程冻结心跳：定时器停摆的间隔就是被阻塞的窗口 ──
      var lastTick = nowFn()
      var lastFlushTick = lastTick
      var heartbeatTimer = setInterval(function () {
        var t = nowFn()
        var gap = t - lastTick
        lastTick = t
        if (gap >= STALL_THRESHOLD_MS) {
          var record = { from: rel(t - gap), to: rel(t), gap: Math.round(gap) }
          if (state.stalls.length >= MAX_STALLS) state.stalls.shift()
          state.stalls.push(record)
          push('main-thread-stall', record, true)
          flush()
          return
        }
        if (t - lastFlushTick >= FLUSH_INTERVAL_MS) {
          lastFlushTick = t
          flush()
        }
      }, HEARTBEAT_MS)

      function stopHeartbeat() {
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer)
          heartbeatTimer = null
        }
      }

      // 安全网：即便启动始终未完成（正是要抓的场景），也不让心跳无限期运行
      setTimeout(stopHeartbeat, 90000)

      // ── 子资源加载失败（捕获阶段；资源 error 不冒泡） ──
      var RESOURCE_TAGS = { img: 1, link: 1, script: 1, source: 1, video: 1, audio: 1, iframe: 1 }
      document.addEventListener('error', function (event) {
        var target = event.target
        if (!target || target === window || target === document) return
        var tag = String(target.tagName || '').toLowerCase()
        if (!RESOURCE_TAGS[tag]) return
        push('resource-error', {
          tag: tag,
          url: sanitizeUrl(target.currentSrc || target.src || target.href),
          ready_state: document.readyState
        }, true)
        scheduleFlush()
      }, true)

      // ── 启动页图片是否真的「拿到并解码」 ──
      function probeImage(el, label) {
        if (!el) return
        var settle = function (state_) {
          push('splash-image', { label: label, state: state_, natural_width: el.naturalWidth || 0 }, true)
          scheduleFlush()
        }
        if (el.complete) {
          settle(el.naturalWidth > 0 ? 'loaded' : 'failed')
          return
        }
        el.addEventListener('load', function () { settle('loaded') })
        el.addEventListener('error', function () { settle('failed') })
      }

      probeImage(document.querySelector('.native-splash-logo-ring img'), 'logo')
      probeImage(document.querySelector('.native-splash-building'), 'building')

      // 背景图是 CSS background，无法直接观测；用同 URL 的 Image() 探针代替
      try {
        var bgProbe = new Image()
        bgProbe.onload = function () {
          push('splash-bg', { state: 'loaded', natural_width: bgProbe.naturalWidth || 0 }, true)
          scheduleFlush()
        }
        bgProbe.onerror = function () {
          push('splash-bg', { state: 'failed' }, true)
          scheduleFlush()
        }
        bgProbe.src = '/splash/cas_bg.webp'
      } catch (e) { /* ignore */ }

      // ── 生命周期与可见性 ──
      document.addEventListener('DOMContentLoaded', function () {
        push('dom-content-loaded', { ready_state: document.readyState })
        scheduleFlush()
      })
      window.addEventListener('load', function () {
        push('window-load')
        scheduleFlush()
      })
      window.addEventListener('pageshow', function (e) {
        push('pageshow', { persisted: !!(e && e.persisted) })
        scheduleFlush()
      })
      document.addEventListener('visibilitychange', function () {
        push('visibilitychange', { state: document.visibilityState })
        scheduleFlush()
      })
      window.addEventListener('beforeunload', function () {
        push('beforeunload', {}, true)
        flush()
      })

      // ── 启动页移除：必须记录「原因 + 耗时」，这是判定卡死阶段的关键 ──
      var removed = false
      function removeNativeSplash(reason) {
        if (removed) return
        var el = document.getElementById('native-splash')
        if (!el) {
          removed = true
          return
        }
        removed = true
        try {
          el.style.transition = 'opacity 0.25s ease'
          el.style.opacity = '0'
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el)
          }, 280)
        } catch (e) {
          try { el.remove() } catch (_) {}
        }
        push('splash-removed', { reason: reason, elapsed: rel(nowFn()) }, true)
        flush()
        if (reason && typeof console !== 'undefined') {
          console.info('[native-splash] removed:', reason)
        }
      }
      // 2 秒硬超时（Vue 正常会在更早挂载并替换 #app）
      setTimeout(function () { removeNativeSplash('timeout-2s') }, 2000)
      // 最长 5 秒仍在则强制移除（双保险）
      setTimeout(function () { removeNativeSplash('timeout-5s') }, 5000)
      document.addEventListener('click', function () {
        removeNativeSplash('click')
      }, true)
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
          removeNativeSplash('keydown')
        }
      }, true)
      window.__removeNativeSplash = removeNativeSplash
    })()
  </script>
  <script type="module" charset="utf-8" src="/src/main.ts"></script>
</body>

</html>
